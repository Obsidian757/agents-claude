[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-voice"
version = "0.1.0"
description = "Voice-enabled agent scaffolding"
authors = [{name = "12th House AI"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.35.0",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4",
    "numpy>=1.24",
    "scipy>=1.10",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
